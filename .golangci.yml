# golangci-lint 配置（v2 格式）。
# 默认 linters（govet/errcheck/staticcheck/ineffassign 等）+ gosec（安全兜底：
# 路径穿越、命令注入、弱加密等）。
version: "2"

linters:
  default: standard
  enable:
    - gosec
  settings:
    errcheck:
      # defer 资源清理（Close/Remove）忽略 err 是 Go 惯例，err 通常无意义。
      exclude-functions:
        - (io.Closer).Close
        - (net.Conn).Close
        - (*os.File).Close
        - os.Remove
